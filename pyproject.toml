[project]
name = "two-point-five-d-info"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
]

[project.scripts]
2point5dinfo = "two_point_five_d_info.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
